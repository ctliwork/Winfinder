name: Release

# Manual UI dispatch, or an explicit versioned request committed by the owner.
# Ordinary code pushes do not publish a release.
on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      notes:
        description: "更新說明（顯示在 App 的更新提示裡）"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

# Never run two publishers at once; do not cancel an upload already in progress.
concurrency:
  group: winfinder-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and reserve release tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node .github/scripts/prepare-release.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - name: Rust tests on Windows
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseCommitish: ${{ github.sha }}
          tagName: ${{ steps.prepare.outputs.tag }}
          releaseName: Winfinder v${{ steps.prepare.outputs.version }}
          releaseBody: ${{ steps.prepare.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Add stable-name installer and verify updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe Winfinder_x64-setup.exe
          cp Winfinder_x64-setup.exe Finder-for-Windows_x64-setup.exe
          gh release upload "$TAG" Winfinder_x64-setup.exe Finder-for-Windows_x64-setup.exe --clobber
          gh release download "$TAG" --pattern latest.json --dir updater-check --clobber
          node .github/scripts/verify-release.mjs
      - name: Preserve built bundles if publication fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles-${{ steps.prepare.outputs.version || github.run_number }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: ignore
