name: Release

# Manual only (Actions tab → Release → Run workflow), to save Actions minutes.
# Each run publishes v0.3.<run number>; installed apps pick it up through the updater.
on:
  # One-time release authorized after this exact Windows validation run.
  workflow_run:
    workflows: ["Windows test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "更新說明（顯示在 App 的更新提示裡）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 41559994340 && github.event.workflow_run.conclusion == 'success') }}
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Rust tests on Windows
        working-directory: src-tauri
        run: cargo test

      - name: Set version
        shell: bash
        run: |
          VERSION="0.3.${{ github.run_number }}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2))" "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: Winfinder v__VERSION__
          releaseBody: ${{ inputs.notes || (github.event_name == 'workflow_run' && '新增終端機字型與 8–48 px 字體大小設定，立即套用所有分頁並保留設定。終端機內按 Ctrl+, 開啟設定；關閉設定後可直接繼續輸入。已通過 Windows 實際 App 字型、PowerShell 操作與完整重啟測試。') || '下載 Winfinder_x64-setup.exe 安裝。已安裝的版本會自動提示更新。' }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # A fixed file name so /releases/latest/download/... always points at the newest installer.
      - name: Add stable-name installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe Winfinder_x64-setup.exe
          # The old name too, for links made before the app was renamed.
          cp Winfinder_x64-setup.exe Finder-for-Windows_x64-setup.exe
          gh release upload "v$VERSION" Winfinder_x64-setup.exe Finder-for-Windows_x64-setup.exe --clobber
