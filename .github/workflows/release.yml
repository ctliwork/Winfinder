name: Release

# Normally manual (Actions tab → Release → Run workflow), to save Actions minutes.
# Each run publishes v0.3.<run number>; installed apps pick it up through the updater.
on:
  # One-time glass UI release authorized by the owner; only attempt 2 of this validated run.
  workflow_run:
    workflows: ["Glass interface check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "更新說明（顯示在 App 的更新提示裡）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 43139348486 && github.event.workflow_run.run_attempt == 2 && github.event.workflow_run.conclusion == 'success') }}
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Rust tests on Windows
        working-directory: src-tauri
        run: cargo test

      - name: Set version
        shell: bash
        run: |
          VERSION="0.3.${{ github.run_number }}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2))" "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseCommitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          tagName: v__VERSION__
          releaseName: Winfinder v__VERSION__
          releaseBody: ${{ inputs.notes || (github.event_name == 'workflow_run' && '更新為 macOS 風格霧面玻璃介面：半透明側欄與工具列、浮起的圓角分頁、柔和陰影與細緻邊框。Windows 11 22H2 以上使用原生 Acrylic 背景模糊，較舊版本使用相同風格的實色底色。支援深淺色與降低透明度／高對比模式，檔案內容區保持清晰。已通過 34 項 Rust 測試與 Windows 實際介面、導覽、預覽及分頁檢查。') || '下載 Winfinder_x64-setup.exe 安裝。已安裝的版本會自動提示更新。' }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # A fixed file name so /releases/latest/download/... always points at the newest installer.
      - name: Add stable-name installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe Winfinder_x64-setup.exe
          # The old name too, for links made before the app was renamed.
          cp Winfinder_x64-setup.exe Finder-for-Windows_x64-setup.exe
          gh release upload "v$VERSION" Winfinder_x64-setup.exe Finder-for-Windows_x64-setup.exe --clobber
