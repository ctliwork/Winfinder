name: Windows test

# Manual only (Actions tab → Windows test → Run workflow): the Rust tests on
# Windows, then the real app end to end (tests/windows-e2e.mjs). The report
# and desktop screenshots are in the run's "e2e" artifact.
on:
  workflow_dispatch:
    inputs:
      terminal_only:
        description: "只跑 Rust 與終端機字型回歸（略過其他介面測試）"
        type: boolean
        required: false
        default: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Rust tests on Windows
        working-directory: src-tauri
        run: cargo test

      - name: Build the app (debug)
        if: ${{ !cancelled() }}
        run: npx tauri build --debug --no-bundle

      - name: Test files
        if: ${{ !cancelled() }}
        run: |
          pip install python-docx python-pptx openpyxl fpdf2 pillow
          python tests/make_fixtures.py e2e-files

      - name: End to end
        if: ${{ !cancelled() && !inputs.terminal_only }}
        timeout-minutes: 20
        run: |
          npm install --no-save playwright-core@1.58.2
          node tests/windows-e2e.mjs e2e-files

      - name: Install terminal test driver
        if: ${{ !cancelled() && inputs.terminal_only }}
        run: npm install --no-save playwright-core@1.58.2

      - name: Terminal font regression (real Windows app)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: node tests/terminal-font-e2e.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: e2e-out
