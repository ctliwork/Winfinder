[package]
name = "finder-win"
version = "0.2.0"
description = "A macOS Finder-style file manager for Windows"
edition = "2021"
rust-version = "1.80"

[lib]
name = "finder_win_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
jwalk = "0.8"
notify = "8"
trash = "5"
dirs = "6"
base64 = "0.22"
png = "0.17"
lnk = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
